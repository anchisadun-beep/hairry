<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>รายการสั่งซื้อ — HAIRRY Admin</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .page-title {
      padding: var(--space-6) 0 var(--space-4);
      text-align: center;
    }

    .page-title h1 {
      font-size: clamp(2rem, 3vw + 1rem, 3rem);
    }

    .table-wrap {
      overflow-x: auto;
      background: var(--white);
      border: 1px solid var(--line-faint);
      border-radius: var(--radius);
    }

    #ordersTable {
      width: 100%;
      min-width: 760px;
      border-collapse: collapse;
      font-size: 0.9rem;
    }

    #ordersTable th,
    #ordersTable td {
      text-align: left;
      vertical-align: top;
      padding: var(--space-2) var(--space-3);
      border-bottom: 1px solid var(--line-faint);
      line-height: 1.7;
    }

    #ordersTable thead th {
      font-family: var(--font-display);
      font-size: 1rem;
      font-weight: 600;
      color: var(--ink);
      background: var(--cream);
      border-bottom: 1px solid var(--line);
      white-space: nowrap;
    }

    #ordersTable tbody tr:last-child td {
      border-bottom: 0;
    }

    #ordersTable tbody td {
      color: var(--ink-soft);
    }

    #ordersTable th:nth-child(5),
    #ordersTable td:nth-child(5) {
      text-align: right;
      white-space: nowrap;
    }

    @media (max-width: 640px) {
      .page-title { padding: var(--space-5) 0 var(--space-3); }
    }
  </style>
</head>
<body>

  <header class="site-header">
    <div class="container">
      <a class="brand" href="index.html">HAIRRY</a>
      <nav aria-label="เมนูหลัก">
        <ul class="nav">
          <li><a href="index.html">หน้าแรก</a></li>
          <li><a href="product.html">สินค้า</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <main>
    <section class="page-title">
      <div class="container">
        <h1>รายการสั่งซื้อ</h1>
        <hr class="rule">
        <p>แสดงรายการล่าสุดก่อน</p>
      </div>
    </section>

    <section class="section" style="padding-top: var(--space-4);">
      <div class="container">
        <div class="table-wrap">
          <table id="ordersTable">
            <thead>
              <tr>
                <th scope="col">วันเวลา</th>
                <th scope="col">ชื่อลูกค้า</th>
                <th scope="col">เบอร์โทร / Line</th>
                <th scope="col">รายการสินค้า</th>
                <th scope="col">จำนวนเงินรวม</th>
                <th scope="col">หมายเหตุ</th>
              </tr>
            </thead>
            <tbody></tbody>
          </table>
        </div>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container">
      <div class="brand">HAIRRY</div>
      <hr class="rule">
      <p>&copy; 2026 HAIRRY. สงวนลิขสิทธิ์</p>
    </div>
  </footer>

  <script src="script.js"></script>
</body>
</html>
